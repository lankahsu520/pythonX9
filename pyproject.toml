[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "utilsP9"
version = "1.0.0"
description = "utilsP9 provides simple APIs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ifaddr",
    "matplotlib",
    "netifaces==0.11.0",
    "pandas",
    "psutil",
    "streamlink"
]

[tool.setuptools.packages.find]
include = ["utilsP9*"]

